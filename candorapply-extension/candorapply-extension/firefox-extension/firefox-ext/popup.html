<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CandorApply</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f6f1;
      color: #17201d;
    }

    .popup {
      padding: 18px;
    }

    /* Header */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 16px;
      border-bottom: 1px solid #dfe4df;
      margin-bottom: 16px;
    }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 7px; flex-shrink: 0;
      background: #245c46;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { width: 17px; height: 17px; }
    .logo-text { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
    .logo-tagline { font-size: 11px; color: #66706b; margin-top: 1px; }

    /* Status card */
    .status-card {
      background: #fff;
      border: 1px solid #dfe4df;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #66706b;
      margin-bottom: 8px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: #EF4444;
    }
    .dot.active { background: #3f765f; }
    .dot.warn   { background: #b07a27; }
    #auth-name {
      font-weight: 650; color: #17201d;
      font-size: 13px;
    }

    /* Info box */
    .info-box {
      background: #eef3f0;
      border: 1px solid #d8e4dd;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: #53605a;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    /* Buttons */
    .actions { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      width: 100%; padding: 11px 16px; border-radius: 7px;
      font-size: 13px; font-weight: 650; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: none; font-family: inherit; transition: all 0.15s;
    }
    .btn-primary {
      background: #245c46;
      color: white;
    }
    .btn-primary:hover { background: #193f31; }
    .btn-ghost {
      background: #fff;
      border: 1px solid #cfd7d1;
      color: #445049;
    }
    .btn-ghost:hover { background: #eef0ed; color: #17201d; }

    /* Footer */
    .footer {
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid #dfe4df;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-link {
      background: none; border: none; cursor: pointer;
      font-size: 12px; color: #66706b; font-family: inherit;
      transition: color 0.15s;
    }
    .footer-link:hover { color: #245c46; }
    .version { font-size: 11px; color: #929b96; }
  </style>
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">CandorApply</div>
        <div class="logo-tagline">Review-first application assistant</div>
      </div>
    </div>

    <div class="status-card">
      <div class="status-row">
        <div class="dot" id="auth-dot"></div>
        <span id="auth-status">Checking connection…</span>
      </div>
      <div class="status-row" id="name-row" style="display:none">
        <div style="width:7px"></div>
        <span id="auth-name"></span>
      </div>
      <div class="status-row">
        <div class="dot warn" id="job-dot"></div>
        <span id="job-status">No job detected on this page</span>
      </div>
    </div>

    <div class="info-box" id="info-message">
      Visit a job listing to activate the AutoFill assistant.
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-assistant">Open assistant on this page</button>
      <button class="btn btn-ghost" id="btn-open">Open CandorApply</button>
      <button class="btn btn-ghost" id="btn-refresh">↻ Refresh Connection</button>
    </div>

    <div class="footer">
      <button class="footer-link" id="btn-help">Manage profile</button>
      <span class="version">v1.3.0</span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
