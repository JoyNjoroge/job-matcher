<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CandorApply</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0C0C10;
      color: #F0EEE8;
    }

    .popup {
      padding: 18px;
    }

    /* Header */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 16px;
    }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 14px rgba(99,102,241,0.4);
    }
    .logo-mark svg { width: 17px; height: 17px; }
    .logo-text { font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
    .logo-tagline { font-size: 11px; color: rgba(240,238,232,0.4); margin-top: 1px; }

    /* Status card */
    .status-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: rgba(240,238,232,0.7);
      margin-bottom: 8px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: #EF4444;
    }
    .dot.active { background: #22C55E; box-shadow: 0 0 6px #22C55E; }
    .dot.warn   { background: #F59E0B; }
    #auth-name {
      font-weight: 700; color: #F0EEE8;
      font-size: 13px;
    }

    /* Info box */
    .info-box {
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.18);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: rgba(240,238,232,0.6);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    /* Buttons */
    .actions { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      width: 100%; padding: 11px 16px; border-radius: 9px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: none; font-family: inherit; transition: all 0.15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: white;
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.45); }
    .btn-ghost {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(240,238,232,0.7);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); color: #F0EEE8; }

    /* Footer */
    .footer {
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-link {
      background: none; border: none; cursor: pointer;
      font-size: 12px; color: rgba(240,238,232,0.3); font-family: inherit;
      transition: color 0.15s;
    }
    .footer-link:hover { color: rgba(240,238,232,0.6); }
    .version { font-size: 11px; color: rgba(240,238,232,0.2); }
  </style>
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">CandorApply</div>
        <div class="logo-tagline">Your AI career copilot</div>
      </div>
    </div>

    <div class="status-card">
      <div class="status-row">
        <div class="dot" id="auth-dot"></div>
        <span id="auth-status">Checking connection…</span>
      </div>
      <div class="status-row" id="name-row" style="display:none">
        <div style="width:7px"></div>
        <span id="auth-name"></span>
      </div>
      <div class="status-row">
        <div class="dot warn" id="job-dot"></div>
        <span id="job-status">No job detected on this page</span>
      </div>
    </div>

    <div class="info-box" id="info-message">
      Visit a job listing to activate the AutoFill assistant.
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-open">Open CandorApply</button>
      <button class="btn btn-ghost" id="btn-refresh">↻ Refresh Connection</button>
    </div>

    <div class="footer">
      <button class="footer-link" id="btn-help">Help & Support</button>
      <span class="version">v1.1.0</span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
