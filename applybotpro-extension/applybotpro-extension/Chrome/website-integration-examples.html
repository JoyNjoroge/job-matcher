<script>
// Detect browser and show appropriate install button
document.addEventListener('DOMContentLoaded', () => {
  const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
  const isFirefox = /Firefox/.test(navigator.userAgent);
  
  const chromeBtn = document.getElementById('install-chrome');
  const firefoxBtn = document.getElementById('install-firefox');
  
  // Update links with your actual extension store URLs
  if (isChrome) {
    chromeBtn.href = 'https://chrome.google.com/webstore/detail/YOUR_EXTENSION_ID';
    firefoxBtn.style.display = 'none';
  } else if (isFirefox) {
    firefoxBtn.href = 'https://addons.mozilla.org/firefox/addon/YOUR_EXTENSION_NAME';
    chromeBtn.style.display = 'none';
  } else {
    // Show both for other browsers
    chromeBtn.href = 'https://chrome.google.com/webstore/detail/YOUR_EXTENSION_ID';
    firefoxBtn.href = 'https://addons.mozilla.org/firefox/addon/YOUR_EXTENSION_NAME';
  }
});
</script>


<!-- =============================================
     2. JOB APPLICATION REDIRECT CODE
     Use this when user clicks "Apply" button
============================================== -->

<script>
/**
 * Redirect to job application with tracking parameter
 * Call this when user clicks "Apply" on a job
 */
function applyToJob(job) {
  // Get the job's application URL
  let applicationUrl = job.application_url;
  
  // Add tracking parameter for extension
  const separator = applicationUrl.includes('?') ? '&' : '?';
  const trackedUrl = `${applicationUrl}${separator}applybotpro_job_id=${job.id}`;
  
  // Optional: Store job data for extension to access
  localStorage.setItem('pending_job_' + job.id, JSON.stringify({
    id: job.id,
    title: job.title,
    company: job.company,
    description: job.description,
    redirectedAt: new Date().toISOString()
  }));
  
  // Open in new tab
  window.open(trackedUrl, '_blank');
  
  // Optional: Track that user clicked apply
  trackJobClick(job.id);
}

/**
 * Example usage with a button
 */
document.querySelectorAll('.apply-button').forEach(button => {
  button.addEventListener('click', (e) => {
    e.preventDefault();
    
    const jobId = button.dataset.jobId;
    
    // Fetch job details from your API
    fetch(`/api/jobs/${jobId}`)
      .then(res => res.json())
      .then(job => {
        applyToJob(job);
      });
  });
});

/**
 * Track when user clicks apply (optional analytics)
 */
function trackJobClick(jobId) {
  fetch('/api/jobs/track-click', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + getAuthToken()
    },
    body: JSON.stringify({
      job_id: jobId,
      clicked_at: new Date().toISOString()
    })
  });
}

function getAuthToken() {
  // Return your auth token from cookie or localStorage
  return localStorage.getItem('applybotpro_auth_token');
}
</script>


<!-- =============================================
     3. EXTENSION DETECTION & WELCOME MESSAGE
     Show a message if extension is installed
============================================== -->

<script>
/**
 * Detect if ApplyBotPro extension is installed
 */
function checkExtensionInstalled() {
  // Method 1: Try to detect extension by checking for injected elements
  const extensionElement = document.getElementById('applybotpro-assistant');
  
  if (extensionElement) {
    showExtensionWelcome();
  } else {
    // Method 2: Try sending a message to the extension
    if (window.chrome && chrome.runtime) {
      try {
        chrome.runtime.sendMessage(
          'YOUR_EXTENSION_ID', // Replace with actual extension ID
          { type: 'PING' },
          (response) => {
            if (response && response.installed) {
              showExtensionWelcome();
            } else {
              showExtensionPrompt();
            }
          }
        );
      } catch (e) {
        showExtensionPrompt();
      }
    } else {
      showExtensionPrompt();
    }
  }
}

function showExtensionWelcome() {
  const banner = document.createElement('div');
  banner.className = 'extension-banner success';
  banner.innerHTML = `
    <p>✓ ApplyBotPro Extension is active!</p>
    <p>Click "Apply" on any job to get auto-fill assistance.</p>
  `;
  document.body.insertBefore(banner, document.body.firstChild);
}

function showExtensionPrompt() {
  const banner = document.createElement('div');
  banner.className = 'extension-banner info';
  banner.innerHTML = `
    <p>💡 Get auto-fill assistance by installing our browser extension!</p>
    <a href="/extensions" class="banner-btn">Install Extension</a>
    <button class="banner-close">×</button>
  `;
  document.body.insertBefore(banner, document.body.firstChild);
  
  banner.querySelector('.banner-close').addEventListener('click', () => {
    banner.remove();
    localStorage.setItem('extension_prompt_dismissed', 'true');
  });
}

// Check on page load (only if not previously dismissed)
if (!localStorage.getItem('extension_prompt_dismissed')) {
  checkExtensionInstalled();
}
</script>

<style>
